[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-scam-triage"
version = "0.1.0"
description = "Scam and phishing message triage with TypeSafe's Jev, evaluated against fixed baselines on real labelled data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sentovara" }]
dependencies = ["scikit-learn>=1.3", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["scam_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
