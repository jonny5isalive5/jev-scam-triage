name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,live]"
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME) with licences accepted, and the
      # Android Gradle plugin downloads any missing platform itself. android-actions/setup-android@v3
      # failed here because its default package list asks for "tools", which no longer exists.
      - name: Unit tests (golden cases shared with Python), lint, and debug build
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: scam-check-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
